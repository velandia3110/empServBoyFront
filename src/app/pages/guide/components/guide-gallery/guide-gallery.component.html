<section class="py-12 px-4 bg-gray-50">
  <div class="max-w-7xl mx-auto">

    <!-- Encabezado de la galería -->
    <div class="flex items-start justify-between mb-8">
      <div>
        <h2 class="text-2xl md:text-3xl font-bold text-blue-900 mb-2">
          Galería de Aprendizaje
        </h2>
        <p class="text-gray-500 text-sm max-w-md">
          Explora nuestros procesos a través de una lente educativa y visual.
          Cada tarjeta es un paso hacia la sostenibilidad.
        </p>
      </div>

      <!-- Badge estadística -->
      <div class="hidden md:flex flex-col items-center bg-green-400 text-white
                  rounded-full w-16 h-16 justify-center shadow-lg">
        <span class="text-xs font-black leading-none">1.8</span>
        <span class="text-xs font-bold leading-none">TNS</span>
      </div>
    </div>

    <!-- Grid principal de tarjetas grandes -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

      <!-- Tarjeta 1: Manual de Separación (oscura/verde) -->
      <div *ngFor="let card of featuredCards"
           class="relative rounded-2xl overflow-hidden h-56 md:h-64 cursor-pointer group"
           [ngClass]="card.bgClass">

        <!-- Imagen de fondo -->
        <img [src]="card.image"
             [alt]="card.title"
             class="absolute inset-0 w-full h-full object-cover opacity-40
                    group-hover:opacity-50 group-hover:scale-105 transition-all duration-500" />

        <!-- Overlay degradado -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>

        <!-- Contenido -->
        <div class="absolute bottom-0 left-0 p-6">
          <p class="text-xs font-bold uppercase tracking-widest mb-2"
             [ngClass]="card.labelClass">
            {{ card.step }}
          </p>
          <h3 class="text-white text-xl font-bold mb-3">{{ card.title }}</h3>
          <button class="text-white text-sm font-semibold hover:underline transition flex items-center gap-1">
            Leer instructivo →
          </button>
        </div>

        <!-- Ícono decorativo -->
        <div *ngIf="card.icon"
             class="absolute top-4 right-4 w-10 h-10 rounded-full bg-green-400
                    flex items-center justify-center text-white font-bold text-lg shadow-lg">
          {{ card.icon }}
        </div>

      </div>
    </div>

    <!-- Grid secundario: 3 tarjetas medianas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <!-- Tarjeta: Guía de Abono Maduro -->
      <div *ngFor="let card of secondaryCards"
           class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-md
                  transition-shadow duration-300 cursor-pointer group">

        <div class="relative h-36 overflow-hidden">
          <img [src]="card.image"
               [alt]="card.title"
               class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />

          <!-- Badge tipo si existe -->
          <span *ngIf="card.badge"
                class="absolute top-3 left-3 bg-black/60 text-white text-xs
                       font-bold uppercase tracking-wide px-2 py-1 rounded-md">
            {{ card.badge }}
          </span>

          <!-- Play button si es video -->
          <div *ngIf="card.isVideo"
               class="absolute inset-0 flex items-center justify-center">
            <div class="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
              <span class="text-blue-800 text-lg ml-1">▶</span>
            </div>
          </div>
        </div>

        <div class="p-4"
             [ngClass]="card.cardBg || 'bg-white'">
          <h4 class="font-bold text-sm mb-1"
              [ngClass]="card.titleColor || 'text-blue-900'">
            {{ card.title }}
          </h4>
          <p class="text-xs text-gray-500">{{ card.description }}</p>

          <!-- Checklist si existe -->
          <ul *ngIf="card.checks" class="mt-3 space-y-1">
            <li *ngFor="let check of card.checks"
                class="flex items-center gap-2 text-xs text-white">
              <span class="text-green-400 font-bold">✓</span>
              {{ check }}
            </li>
          </ul>
        </div>

      </div>

    </div>

  </div>
</section>

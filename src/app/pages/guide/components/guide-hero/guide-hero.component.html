<section class="carousel-wrapper mx-4 mt-24"
         (mouseenter)="pauseAutoPlay()"
         (mouseleave)="resumeAutoPlay()">

  <!-- Track de slides -->
  <div class="carousel-track">

    @for (slide of slides; track slide.image; let i = $index) {
      <div class="carousel-slide"
           [class.active]="i === current"
           [attr.aria-hidden]="i !== current">
        <img [src]="slide.image"
             [alt]="slide.alt"
             class="carousel-img"
             [class.zoom]="i === current" />
      </div>
    }

    <!-- Gradiente inferior para estética -->
    <div class="carousel-gradient"></div>

  </div>

  <!-- Flecha izquierda -->
  <button class="carousel-arrow arrow-left"
          (click)="prev()"
          aria-label="Imagen anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
    </svg>
  </button>

  <!-- Flecha derecha -->
  <button class="carousel-arrow arrow-right"
          (click)="next()"
          aria-label="Siguiente imagen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
    </svg>
  </button>

  <!-- Indicadores (dots) -->
  <div class="carousel-dots">
    @for (slide of slides; track slide.image; let i = $index) {
      <button class="dot"
              [class.dot-active]="i === current"
              (click)="goTo(i)"
              [attr.aria-label]="'Ir a imagen ' + (i + 1)">
      </button>
    }
  </div>

  <!-- Barra de progreso -->
  <div class="progress-bar">
    <div class="progress-fill"
         [style.width.%]="((current + 1) / slides.length) * 100">
    </div>
  </div>

</section>

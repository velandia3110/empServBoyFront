<aside class="w-56 bg-white h-screen fixed left-0 top-0 flex flex-col border-r border-gray-200 z-20">

  <!-- Logo -->
  <div class="px-5 py-3 border-b border-gray-100 flex items-center">
    <img src="/assets/logo.png" alt="EmpServBoy" class="h-10" />
  </div>

  <!-- Navigation -->
  <nav class="flex-1 p-3 overflow-y-auto">
    <ul class="space-y-1">

      <!-- Escritorio -->
      <li>
        <button
          (click)="setActive('escritorio')"
          [class]="activeItem === 'escritorio'
            ? 'w-full flex items-center gap-3 px-3 py-2 text-white bg-green-500 rounded-lg text-sm font-medium text-left'
            : 'w-full flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm text-left'">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
            </path>
          </svg>
          Escritorio
        </button>
      </li>

      <!-- Gestión de Contenidos -->
      <li>
        <button
          (click)="setActive('gestion')"
          [class]="activeItem === 'gestion'
            ? 'w-full flex items-center gap-3 px-3 py-2 text-white bg-green-500 rounded-lg text-sm font-medium text-left'
            : 'w-full flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm text-left'">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
            </path>
          </svg>
          Gestión de Contenidos
        </button>
      </li>

      <!-- Instructivos -->
      <li>
        <button
          (click)="setActive('instructivos')"
          [class]="activeItem === 'instructivos'
            ? 'w-full flex items-center gap-3 px-3 py-2 text-white bg-green-500 rounded-lg text-sm font-medium text-left'
            : 'w-full flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm text-left'">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
            </path>
          </svg>
          Instructivos
        </button>
      </li>

      <!-- Blog -->
      <li>
        <button
          (click)="setActive('blog')"
          [class]="activeItem === 'blog'
            ? 'w-full flex items-center gap-3 px-3 py-2 text-white bg-green-500 rounded-lg text-sm font-medium text-left'
            : 'w-full flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm text-left'">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
            </path>
          </svg>
          Blog
        </button>
      </li>

      <!-- Configuración -->
      <li>
        <button
          (click)="setActive('configuracion')"
          [class]="activeItem === 'configuracion'
            ? 'w-full flex items-center gap-3 px-3 py-2 text-white bg-green-500 rounded-lg text-sm font-medium text-left'
            : 'w-full flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm text-left'">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
            </path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          Configuración
        </button>
      </li>

    </ul>
  </nav>

  <!-- User info -->
  <div class="p-4 border-t border-gray-100 flex items-center justify-between">
    <div class="flex items-center gap-2 min-w-0">
      <div
        class="w-8 h-8 bg-orange-400 rounded-full flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
        A
      </div>
      <div class="min-w-0">
        <p class="text-sm font-medium text-gray-800 truncate">Admin User</p>
        <p class="text-xs text-gray-400 uppercase tracking-wide">Administrador</p>
      </div>
    </div>
    <button (click)="logout()" class="text-gray-400 hover:text-gray-600 ml-2 flex-shrink-0" title="Cerrar sesión">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
    </button>
  </div>

</aside>

<div class="bg-white px-8 py-5 border-b border-gray-200 flex items-center gap-3">
  <button (click)="cancel()"
    class="text-gray-400 hover:text-gray-600 transition-colors">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
    </svg>
  </button>
  <div>
    <h1 class="text-xl font-bold text-blue-900">
      {{ isEditMode ? 'Editar producto' : 'Nuevo producto' }}
    </h1>
    <p class="text-sm text-gray-400 mt-0.5">
      {{ isEditMode ? 'Modifica los datos del producto' : 'Completa los datos para crear un producto' }}
    </p>
  </div>
</div>

<div class="px-8 pt-6 pb-12 max-w-2xl">

  @if (errorMsg) {
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm mb-5">
    {{ errorMsg }}
  </div>
  }

  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-5">

    <!-- Nombre -->
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1.5">Nombre del producto *</label>
      <input type="text" [(ngModel)]="form.name" placeholder="Ej. Filtro de aceite XL"
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
    </div>

    <!-- Descripción -->
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1.5">Descripción *</label>
      <textarea [(ngModel)]="form.description" rows="4" placeholder="Describe el producto..."
        class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none">
      </textarea>
    </div>

    <!-- Imagen -->
    <div>
      <label class="block text-xs font-semibold text-gray-600 mb-1.5">Imagen del producto</label>

      @if (imagePreview) {
      <div class="relative w-full h-48 rounded-lg overflow-hidden border border-gray-200 mb-2">
        <img [src]="imagePreview" alt="Preview" class="w-full h-full object-cover" />
        <button (click)="removeImage()"
          class="absolute top-2 right-2 bg-white rounded-full p-1 shadow text-gray-500 hover:text-red-500 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      }

      @if (!imagePreview) {
      <label
        class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-200 rounded-lg cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors">
        <svg class="w-8 h-8 text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span class="text-xs text-gray-400">Haz clic para subir una imagen</span>
        <input type="file" accept="image/*" class="hidden" (change)="onImageSelected($event)" />
      </label>
      }

      <!-- Alt text -->
      @if (imagePreview) {
      <div class="mt-2">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Texto alternativo (alt)</label>
        <input type="text" [(ngModel)]="form.alt" placeholder="Descripción de la imagen"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
      </div>
      }
    </div>

  </div>

  <!-- Acciones -->
  <div class="flex items-center gap-3 mt-6">
    <button (click)="save()" [disabled]="saving"
      class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white text-sm font-medium px-5 py-2.5 rounded-lg transition-colors">
      @if (saving) {
      <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      }
      {{ saving ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear producto') }}
    </button>
    <button (click)="cancel()" [disabled]="saving"
      class="text-sm font-medium text-gray-500 hover:text-gray-700 px-4 py-2.5 rounded-lg hover:bg-gray-100 transition-colors disabled:opacity-60">
      Cancelar
    </button>
  </div>

</div>

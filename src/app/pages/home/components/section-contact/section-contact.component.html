<section id="contacto" class="py-20 bg-gray-100">
  <div class="max-w-4xl mx-auto px-6">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-md p-8 md:p-10">

      <!-- Title -->
      <div class="text-center mb-8">
        <h2 class="text-2xl md:text-3xl font-bold text-blue-800">
          Hablemos de Bienestar
        </h2>
        <p class="text-gray-500 mt-2">
          Estamos listos para apoyarte en tus proyectos ambientales.
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-6">

        <!-- Row -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-600 mb-1">Nombres</label>
            <input
              type="text"
              placeholder="Ej: Juan Pérez"
              class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label class="block text-sm text-gray-600 mb-1">Correo</label>
            <input
              type="email"
              placeholder="correo@ejemplo.com"
              class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">Celular</label>
          <input
            type="tel"
            placeholder="+57 300 000 0000"
            class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- Message -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">Mensaje</label>
          <textarea
            rows="4"
            placeholder="Hola, me gustaría..."
            class="w-full bg-gray-100 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>
        </div>

        <!-- Button -->
        <div class="pt-2">
          <button
            type="submit"
            class="w-full bg-blue-800 text-white py-3 rounded-lg font-semibold hover:bg-blue-900 transition"
          >
            Enviar Solicitud
          </button>
        </div>

      </form>

    </div>
  </div>
</section>

<nav class="fixed top-0 w-full bg-gray-100 z-50 border-b border-gray-200">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex justify-between items-center h-20">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center leading-none">
        <img src="/assets/logo.png" alt="EmpServBoy" class="h-14 block" />
      </a>

      <!-- Navigation Links Desktop -->
      <div class="hidden md:flex items-center space-x-10 text-gray-600 font-medium">
        
        <!-- Activo -->
        <a routerLink="/"
           routerLinkActive="text-blue-600 border-b-2 border-blue-600 pb-1"
           [routerLinkActiveOptions]="{ exact: true }"
           class="hover:text-blue-600 transition">
          Inicio
        </a>

        <a routerLink="/guide"
           routerLinkActive="text-blue-600 border-b-2 border-blue-600 pb-1"
           class="hover:text-blue-600 transition">
          Instructivo
        </a>

        <a href="#productos"
           class="hover:text-blue-600 transition">
          Productos
        </a>

        <a href="#contacto"
           class="hover:text-blue-600 transition">
          Contacto
        </a>
      </div>

      <!-- Mobile Button -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" class="text-gray-600 hover:text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>

    </div>

    <!-- Mobile Menu -->
    @if (isMenuOpen) {
      <div class="md:hidden pb-4 text-gray-600">

        <a routerLink="/"
           routerLinkActive="text-blue-600 font-medium"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeMenu()"
           class="block px-4 py-2 hover:text-blue-600">
          Inicio
        </a>

        <a routerLink="/guide"
           routerLinkActive="text-blue-600 font-medium"
           (click)="closeMenu()"
           class="block px-4 py-2 hover:text-blue-600">
          Instructivo
        </a>

        <a href="#productos" (click)="closeMenu()"
           class="block px-4 py-2 hover:text-blue-600">
          Productos
        </a>

        <a href="#contacto" (click)="closeMenu()"
           class="block px-4 py-2 hover:text-blue-600">
          Contacto
        </a>

      </div>
    }
  </div>
</nav>
